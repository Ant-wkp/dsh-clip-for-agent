name: Build Windows Clip worker

on:
  push:
    branches: [windows-rc3]
    paths:
      - '.github/workflows/windows-worker.yml'
      - 'worker/**'
      - 'scripts/build-worker.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ant-wkp/reSpeaker_Clip
          ref: 9e759e51f0abfbbfec622263ce870c5202e5d9aa
          path: sdk-source
          persist-credentials: false
          sparse-checkout: sdk/src
      - uses: actions/checkout@v4
        with:
          repository: xiph/opus
          ref: v1.5.2
          path: opus-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - name: Build libopus for Windows x64
        shell: pwsh
        run: |
          cmake -S opus-source -B opus-build -A x64 -DOPUS_BUILD_SHARED_LIBRARY=ON -DOPUS_STATIC_RUNTIME=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build opus-build --config Release --target opus
      - name: Package worker
        shell: pwsh
        run: |
          python -m pip install bleak==3.0.2 pyinstaller==6.16.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $opus = Get-ChildItem -Path opus-build -Filter opus.dll -Recurse -File | Select-Object -First 1
          if (-not $opus) { throw 'Built Opus DLL not found' }
          ./scripts/build-worker.ps1 -Sdk sdk-source/sdk -OpusDll $opus.FullName
          python -c "from pathlib import Path; import sysconfig; root=Path(sysconfig.get_path('platlib')); licenses=sorted(root.glob('winrt*.dist-info/**/LICENSE*')); assert licenses, 'missing PyWinRT licenses'; unique=dict.fromkeys(x.read_text(encoding='utf-8') for x in licenses if x.is_file()); Path('runtime/notices/winrt.txt').write_text('\n\n'.join(unique), encoding='utf-8')"
      - name: Verify packaged worker over Windows process pipes
        shell: pwsh
        run: |
          @'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix='clip worker ') as cwd:
              worker = subprocess.run(
                  [str(Path('runtime/win32-x64/clip-worker.exe').resolve()), cwd],
                  input='{"id":1,"method":"ping"}\n', text=True,
                  capture_output=True, timeout=45,
              )
              assert worker.returncode == 0, worker.stderr
              assert [json.loads(line) for line in worker.stdout.splitlines()] == [
                  {'event': 'ready', 'data': {'protocol': 1}},
                  {'id': 1, 'ok': True, 'value': True},
              ], worker.stdout
          '@ | python -
      - name: Install package with the DSH rc.3 desktop CLI on Windows
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'clip-test'
          npm install --prefix $temp --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.3 pnpm@11.28.11
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:Path = "$(Join-Path $temp 'node_modules/.bin');$env:Path"
          $env:DSH_HOME = Join-Path $temp 'dsh-home'
          $desktop = Join-Path $env:DSH_HOME 'profiles/desktop'
          New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          '{"name":"dsh-profile-desktop","private":true,"dependencies":{},"dsh":{"profile":{"bundles":[]}}}' |
            Set-Content -Path (Join-Path $desktop 'package.json') -Encoding utf8
          $archive = npm pack --quiet --pack-destination $temp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CLIP_TEST_TARBALL = Join-Path $temp $archive
          $env:CLIP_DSH_LIB = Join-Path $temp 'node_modules/@deepseek-ai/dsh/lib'
          @'
          import { readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'

          const lib = process.env.CLIP_DSH_LIB
          const cli = readdirSync(lib).find(file =>
            /^bin-.*\.js$/.test(file) && readFileSync(join(lib, file), 'utf8').includes('export { runCli }'))
          if (!cli) throw new Error('DSH Desktop CLI entry point not found')
          const { runCli } = await import(pathToFileURL(join(lib, cli)))
          process.argv = [process.execPath, 'dsh-desktop-cli', 'plugin', '--profile', 'desktop', 'add',
            'file:' + process.env.CLIP_TEST_TARBALL]
          await runCli({ manageDesktopProfile: true })
          '@ | node --input-type=module -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installed = Join-Path $desktop 'node_modules/dsh-clip-for-agent'
          $version = (Get-Content -Raw (Join-Path $installed 'package.json') | ConvertFrom-Json).version
          if ($version -ne '0.3.6') { throw "Unexpected installed version $version" }
          if (-not (Test-Path (Join-Path $installed 'runtime/win32-x64/clip-worker.exe'))) {
            throw 'The installed npm package does not include the Windows worker'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: clip-worker-windows-x64
          path: |
            runtime/win32-x64/clip-worker.exe
            runtime/notices/winrt.txt
          if-no-files-found: error
